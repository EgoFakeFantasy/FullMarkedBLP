name: Lean proof verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Check the expanded final theorem
        run: lake env lean CheckMainTheorem.lean
      - name: Audit all compiled theorem dependencies
        run: |
          lake env lean Audit.lean > audit-ci.txt
          tail -n 1 audit-ci.txt
